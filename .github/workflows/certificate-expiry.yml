name: Certificate expiry check

on:
  schedule: [{ cron: '0 3 * * 1' }]
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: nrg-commerce-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # azure/login v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
      - name: Inspect certificate expiration from Terraform-managed Key Vault
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_CLOUD_PROJECT: nrg-commerce
        run: |
          set -euo pipefail
          terraform -chdir=infra/production init -input=false -lockfile=readonly
          KEY_VAULT_NAME="$(terraform -chdir=infra/production output -raw key_vault_name)"
          expiry=$(az keyvault certificate show --vault-name "$KEY_VAULT_NAME" --name api-origin-production --query attributes.expires -o tsv)
          remaining=$(( ( $(date -d "$expiry" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate expires in ${remaining} days"
          test "$remaining" -ge 30
