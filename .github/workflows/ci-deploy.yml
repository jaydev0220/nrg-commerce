name: CI and production release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nrg-commerce-pr-{0}', github.event.pull_request.number) || 'nrg-commerce-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.15.1
  TF_VERSION: 1.15.5
  TF_CLOUD_PROJECT: nrg-commerce
  IMAGE_NAME: ghcr.io/jaydev0220/nrg-commerce-api

jobs:
  quality:
    name: Quality and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PUBLIC_API_BASE_URL: https://api.example.test
      PUBLIC_CDN_BASE_URL: https://cdn.example.test
      PUBLIC_COOKIE_DOMAIN: example.test
      PUBLIC_CONTACT_WORKER_URL: https://contact.example.test
      PUBLIC_CTA_URL: https://catalog.example.test
      PUBLIC_FACEBOOK_URL: https://www.facebook.com/example
      PUBLIC_HOME_URL: https://www.example.test
      PUBLIC_LINE_URL: https://line.me/ti/p/example
      PUBLIC_SITE_URL: https://www.example.test
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CONTACT_SENDER_EMAIL: sender@example.test
      CONTACT_RECIPIENT_EMAIL: recipient@example.test
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:generate
      - name: Check formatting and lint
        run: pnpm --workspace-root run lint
      - run: pnpm check

  tests:
    name: Tests and migration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: nrg_commerce_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nrg_commerce_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nrg_commerce_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nrg_commerce_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/nrg_commerce_ci
      SHADOW_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nrg_commerce_shadow
      PUBLIC_API_BASE_URL: http://127.0.0.1:4174
      PUBLIC_CDN_BASE_URL: https://cdn.example.test
      PUBLIC_COOKIE_DOMAIN: example.test
      PUBLIC_CONTACT_WORKER_URL: https://contact.example.test
      PUBLIC_CTA_URL: https://catalog.example.test
      PUBLIC_FACEBOOK_URL: https://www.facebook.com/example
      PUBLIC_HOME_URL: https://www.example.test
      PUBLIC_LINE_URL: https://line.me/ti/p/example
      PUBLIC_SITE_URL: https://www.example.test
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CONTACT_SENDER_EMAIL: sender@example.test
      CONTACT_RECIPIENT_EMAIL: recipient@example.test
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:generate
      - name: Install Playwright Chromium
        run: pnpm --filter @packages/components exec playwright install --with-deps chromium
      - working-directory: packages/database
        run: pnpm db:shadow:create
      - working-directory: packages/database
        run: pnpm db:deploy
      - working-directory: packages/database
        run: pnpm db:diff
      - run: node scripts/ci/check-migrations.mjs
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm test:e2e

  build:
    name: Build production-shaped artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PUBLIC_API_BASE_URL: https://api.example.test
      PUBLIC_CDN_BASE_URL: https://cdn.example.test
      PUBLIC_COOKIE_DOMAIN: example.test
      PUBLIC_CONTACT_WORKER_URL: https://contact.example.test
      PUBLIC_CTA_URL: https://catalog.example.test
      PUBLIC_FACEBOOK_URL: https://www.facebook.com/example
      PUBLIC_HOME_URL: https://www.example.test
      PUBLIC_LINE_URL: https://line.me/ti/p/example
      PUBLIC_SITE_URL: https://www.example.test
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CONTACT_SENDER_EMAIL: sender@example.test
      CONTACT_RECIPIENT_EMAIL: recipient@example.test
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:generate
      - run: pnpm build

  terraform:
    name: Terraform validation and IaC scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - run: terraform -chdir=infra/production fmt -check -diff
      - run: terraform -chdir=infra/production init -backend=false -input=false -upgrade
      - run: terraform -chdir=infra/production validate
      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with: { tflint_version: v0.64.0 }
      - run: tflint --chdir infra/production --init && tflint --chdir infra/production
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with: { version: v0.69.3 }
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: infra/production
          severity: HIGH,CRITICAL
          exit-code: '1'

  security:
    name: Supply-chain and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { fetch-depth: 0, persist-credentials: false }
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # actions/dependency-review-action v5
        with: { fail-on-severity: moderate }
      - run: node scripts/ci/verify-actions-pinned.mjs
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --exit-code=1 --gitleaks-ignore-path=/repo/.gitleaksignore

  gate:
    name: Validation gate
    if: always()
    needs: [quality, tests, build, terraform, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: needs.quality.result != 'success' || needs.tests.result != 'success' || needs.build.result != 'success' || needs.terraform.result != 'success' || needs.security.result != 'success'
        run: exit 1

  fresh-main:
    name: Reject stale release commits
    if: github.event_name != 'pull_request'
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Require the current main commit
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

  bootstrap-status:
    name: Check production bootstrap completion
    if: github.event_name != 'pull_request'
    needs: [gate, fresh-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-plan
    outputs:
      complete: ${{ steps.check.outputs.complete }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # azure/login v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
      - run: terraform -chdir=infra/production init -input=false -lockfile=readonly
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      - id: check
        name: Check Terraform bootstrap state
        run: |
          complete=false
          if [ "$(terraform -chdir=infra/production output -raw bootstrap_complete 2>/dev/null || true)" = 'true' ]; then
            complete=true
          # Remove this fallback after the first production apply persists bootstrap_complete in HCP state.
          elif key_vault_name="$(terraform -chdir=infra/production output -raw key_vault_name 2>/dev/null)" &&
            az keyvault secret show --vault-name "$key_vault_name" --name bootstrap-complete --query id --output tsv --only-show-errors >/dev/null 2>&1; then
            complete=true
            echo '::notice::Using the legacy Key Vault bootstrap marker for this migration release.'
          else
            echo '::notice::Production bootstrap is incomplete; release jobs will be skipped.'
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}

  publish-api-image:
    name: Publish immutable API image
    if: github.event_name != 'pull_request' && needs.bootstrap-status.outputs.complete == 'true'
    needs: [gate, fresh-main, bootstrap-status]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # docker/setup-buildx-action v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # docker/login-action v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true
      - id: resolve
        name: Resolve the Linux amd64 image manifest
        env:
          IMAGE_INDEX: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image_digest="$(docker buildx imagetools inspect "$IMAGE_INDEX" --format '{{range .Manifest.Manifests}}{{if and (eq .Platform.OS "linux") (eq .Platform.Architecture "amd64")}}{{.Digest}}{{end}}{{end}}')"
          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve a Linux amd64 image manifest from $IMAGE_INDEX: $image_digest" >&2
            exit 1
          fi
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # anchore/scan-action v7
        with:
          {
            image: '${{ env.IMAGE_NAME }}@${{ steps.resolve.outputs.digest }}',
            fail-build: true,
            severity-cutoff: high
          }

  plan:
    name: Plan production infrastructure
    if: github.event_name != 'pull_request' && needs.bootstrap-status.outputs.complete == 'true'
    needs: [gate, publish-api-image, bootstrap-status]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-plan
    outputs:
      plan-sha: ${{ steps.hash.outputs.sha256 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # azure/login v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
      - name: Validate production-only release configuration
        run: node scripts/ci/production-env.mjs infrastructure
        env:
          DEPLOYMENT_ENVIRONMENT: production
          ADMIN_DOMAIN: admin.nrglabware.com
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_CLOUD_PROJECT: nrg-commerce
          TF_WORKSPACE: nrg-commerce-production
      - run: terraform -chdir=infra/production init -input=false -lockfile=readonly
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      - name: Load owner URL for Terraform grants
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: |
          owner_url="$(terraform -chdir=infra/production output -raw neon_owner_database_url)"
          echo "TF_VAR_neon_owner_database_url=$owner_url" >> "$GITHUB_ENV"
          OWNER_DATABASE_URL="$owner_url" node scripts/ci/write-postgresql-env.mjs "$GITHUB_ENV"
      - name: Create saved plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_terraform_api_token: ${{ secrets.CLOUDFLARE_TERRAFORM_TOKEN }}
          TF_VAR_r2_admin_access_key_id: ${{ secrets.R2_ADMIN_ACCESS_KEY_ID }}
          TF_VAR_r2_admin_secret_access_key: ${{ secrets.R2_ADMIN_SECRET_ACCESS_KEY }}
          TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_azure_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT }}
          TF_VAR_api_image: ${{ env.IMAGE_NAME }}@${{ needs.publish-api-image.outputs.image-digest }}
          TF_VAR_origin_certificate_enabled: ${{ vars.ORIGIN_CERTIFICATE_ENABLED || 'true' }}
          TF_VAR_origin_certificate_pfx_base64: ${{ secrets.API_ORIGIN_PFX_BASE64 || '' }}
          TF_VAR_origin_certificate_password: ${{ secrets.API_ORIGIN_PFX_PASSWORD || '' }}
          TF_VAR_enable_cloudflare_proxy: ${{ vars.ENABLE_CLOUDFLARE_PROXY || 'true' }}
          TF_VAR_runtime_secrets: ${{ secrets.TF_RUNTIME_SECRETS_JSON || '{}' }}
        run: terraform -chdir=infra/production plan -input=false -lock-timeout=5m -out=deployment.tfplan
      - run: terraform -chdir=infra/production show -no-color deployment.tfplan > deployment.plan.txt
      - run: sudo apt-get update && sudo apt-get install --yes age
      - run: age --encrypt --recipient "$TF_PLAN_AGE_RECIPIENT" --output deployment.tfplan.age infra/production/deployment.tfplan
        env:
          TF_PLAN_AGE_RECIPIENT: ${{ vars.TF_PLAN_AGE_RECIPIENT }}
      - id: hash
        run: echo "sha256=$(sha256sum deployment.tfplan.age | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with: { name: production-terraform-plan, path: deployment.tfplan.age, retention-days: 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with: { name: production-plan-summary, path: deployment.plan.txt, retention-days: 1 }

  apply-infrastructure:
    name: Apply approved production plan
    if: github.event_name != 'pull_request'
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # azure/login v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
      - name: Reject stale plan before apply
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with: { name: production-terraform-plan }
      - run: sudo apt-get update && sudo apt-get install --yes age
      - run: |
          printf '%s' "$TF_PLAN_AGE_IDENTITY" > plan-identity.txt
          chmod 600 plan-identity.txt
          age --decrypt --identity plan-identity.txt --output infra/production/deployment.tfplan deployment.tfplan.age
          test "$(sha256sum deployment.tfplan.age | cut -d' ' -f1)" = "${{ needs.plan.outputs.plan-sha }}"
          rm -f plan-identity.txt deployment.tfplan.age
          export TF_TOKEN_app_terraform_io="$HCP_TERRAFORM_TOKEN"
          terraform -chdir=infra/production init -input=false -lockfile=readonly
          terraform -chdir=infra/production apply -input=false -lock-timeout=5m deployment.tfplan
          rm -f infra/production/deployment.tfplan deployment.tfplan
        env:
          TF_PLAN_AGE_IDENTITY: ${{ secrets.TF_PLAN_AGE_IDENTITY }}
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}

  migrate:
    name: Migrate and seed database
    if: github.event_name != 'pull_request'
    needs: [apply-infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @packages/database db:generate
      - run: node scripts/ci/check-migrations.mjs
      - name: Read owner URL from HCP state and migrate
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: |
          terraform -chdir=infra/production init -input=false -lockfile=readonly
          export DATABASE_URL="$(terraform -chdir=infra/production output -raw neon_owner_database_url)"
          export DIRECT_URL="$DATABASE_URL"
          pnpm --filter @packages/database db:deploy
          pnpm --filter @packages/database db:seed

  deploy-api:
    name: Deploy API revision
    if: github.event_name != 'pull_request'
    needs: [migrate, publish-api-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions: { id-token: write, contents: read }
    steps:
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # azure/login v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
      - run: |
          set -euo pipefail
          revision_suffix="api-${GITHUB_SHA::12}"
          revision_name="${AZURE_CONTAINER_APP_NAME}--${revision_suffix}"
          az containerapp update --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --image "$API_IMAGE" --revision-suffix "$revision_suffix" --output none
          for attempt in $(seq 1 30); do
            revision_status="$(az containerapp revision show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$revision_name" --query '{running:properties.runningState,health:properties.healthState}' -o json 2>/dev/null || printf '{}')"
            revision_state="$(jq -r '.running // empty' <<<"$revision_status")"
            revision_health="$(jq -r '.health // empty' <<<"$revision_status")"
            if [[ "$revision_health" == Healthy && ( "$revision_state" == Running || "$revision_state" == ScaledToZero ) ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "API revision did not become healthy: $revision_status" >&2
              exit 1
            fi
            sleep 10
          done
          az containerapp ingress traffic set --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision-weight "${revision_name}=100" --output none
          az containerapp revision list --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "[?properties.trafficWeight==\`100\`].name" -o tsv
        env:
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.publish-api-image.outputs.image-digest }}

  deploy-contact:
    name: Deploy contact Worker
    if: github.event_name != 'pull_request'
    needs: [migrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - run: pnpm install --frozen-lockfile
      - name: Validate production contact configuration and write contact secrets
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          DEPLOYMENT_ENVIRONMENT: production
          LANDING_SITE_URL: https://www.nrglabware.com
          CONTACT_DOMAIN: contact.nrglabware.com
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          ALLOWED_ORIGINS: https://www.nrglabware.com,https://catalog.nrglabware.com
          CONTACT_SENDER_EMAIL: noreply@nrglabware.com
          CONTACT_RECIPIENT_EMAIL: contact@nrglabware.com
        run: |
          set -euo pipefail
          terraform -chdir=infra/production init -input=false -lockfile=readonly
          export TURNSTILE_SITE_KEY="$(terraform -chdir=infra/production output -raw turnstile_site_key)"
          node scripts/ci/production-env.mjs contact
          TURNSTILE_SECRET_KEY="$(terraform -chdir=infra/production output -raw turnstile_secret_key)" \
            node scripts/ci/contact-secrets.mjs "$RUNNER_TEMP/contact-secrets.json"
      - working-directory: apps/contact-worker
        run: pnpm exec wrangler deploy --env production --domain contact.nrglabware.com --secrets-file "$RUNNER_TEMP/contact-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/contact-secrets.json"

  deploy-frontends:
    name: Deploy ${{ matrix.app }} Worker
    if: github.event_name != 'pull_request'
    needs: [apply-infrastructure, deploy-api, deploy-contact]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            domain: admin.nrglabware.com
          - app: catalog
            domain: catalog.nrglabware.com
          - app: landing
            domain: www.nrglabware.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - run: pnpm install --frozen-lockfile
      - name: Read and validate production frontend configuration
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          DEPLOYMENT_ENVIRONMENT: production
          LANDING_SITE_URL: https://www.nrglabware.com
          LANDING_DOMAIN: www.nrglabware.com
          ADMIN_DOMAIN: admin.nrglabware.com
          CATALOG_DOMAIN: catalog.nrglabware.com
          CONTACT_DOMAIN: contact.nrglabware.com
          CATALOG_API_BASE_URL: https://api.nrglabware.com
          ADMIN_API_BASE_URL: https://api.nrglabware.com
          CDN_BASE_URL: https://cdn.nrglabware.com
          COOKIE_DOMAIN: nrglabware.com
          FACEBOOK_URL: https://www.facebook.com/100057611824911
          LINE_URL: https://line.me/ti/p/xYZS-jqz4e
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/production init -input=false -lockfile=readonly
          export PUBLIC_TURNSTILE_SITE_KEY="$(terraform -chdir=infra/production output -raw turnstile_site_key)"
          export TURNSTILE_SITE_KEY="$PUBLIC_TURNSTILE_SITE_KEY"
          node scripts/ci/production-env.mjs "${{ matrix.app }}"
          echo "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY" >> "$GITHUB_ENV"
      - name: Build Worker artifact
        run: pnpm --filter @apps/${{ matrix.app }} build
        env:
          PUBLIC_API_BASE_URL: https://api.nrglabware.com
          PUBLIC_CDN_BASE_URL: https://cdn.nrglabware.com
          PUBLIC_COOKIE_DOMAIN: nrglabware.com
          PUBLIC_CONTACT_WORKER_URL: https://contact.nrglabware.com
          PUBLIC_CTA_URL: https://catalog.nrglabware.com
          PUBLIC_FACEBOOK_URL: https://www.facebook.com/100057611824911
          PUBLIC_HOME_URL: https://www.nrglabware.com
          PUBLIC_LINE_URL: https://line.me/ti/p/xYZS-jqz4e
          PUBLIC_SITE_URL: https://www.nrglabware.com
      - name: Verify artifact contents
        run: node scripts/ci/verify-frontend-artifact.mjs "${{ matrix.app }}"
      - working-directory: apps/${{ matrix.app }}
        run: pnpm exec wrangler deploy --env production --domain "${{ matrix.domain }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  release-manifest:
    name: Record release manifest
    if: github.event_name != 'pull_request'
    needs: [migrate, deploy-api, deploy-contact, deploy-frontends, publish-api-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # azure/login v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # pnpm/action-setup v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Capture provider control-plane identifiers
        env:
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_IMAGE_DIGEST: ${{ env.IMAGE_NAME }}@${{ needs.publish-api-image.outputs.image-digest }}
          TF_RUN_ID: ${{ github.run_id }}
          MIGRATION_ID: ${{ github.run_id }}
          RELEASE_STARTED_AT: ${{ github.run_started_at }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export API_REVISION="$(az containerapp revision list --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv)"
          worker_versions='{}'
          for worker in admin catalog landing contact; do
            case "$worker" in
              admin) app=admin ;;
              catalog) app=catalog ;;
              landing) app=landing ;;
              contact) app=contact-worker ;;
            esac
            versions="$(cd "apps/$app" && pnpm exec wrangler versions list --env production --name "nrg-commerce-$worker" --json)"
            version_id="$(printf '%s' "$versions" | jq -r '.. | objects | (.id? // .version_id? // empty) | select(type == "string")' | head -n 1)"
            test -n "$version_id"
            worker_versions="$(jq -c --arg worker "$worker" --arg version "$version_id" '. + {($worker): $version}' <<<"$worker_versions")"
          done
          export WORKER_VERSIONS_JSON="$worker_versions"
          node scripts/ci/write-release-manifest.mjs "$RUNNER_TEMP/release-manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: production-release-manifest
          path: ${{ runner.temp }}/release-manifest.json
          retention-days: 90
