<!doctype html>
<html lang="zh-TW">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,follow" />
		<meta
			name="description"
			content="找不到您要查看的頁面。請返回首頁或選擇其他網站內容。 The requested page could not be found. Return home or choose another page."
		/>
		<title>找不到頁面 | Page not found | NRG Labware</title>
		<style>
			:root {
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
				color: #26211e;
				background: #f8f7f5;
			}
			body { margin: 0; min-width: 320px; }
			main {
				box-sizing: border-box;
				min-height: 100vh;
				padding: 5rem 1.5rem;
				display: grid;
				place-content: center;
				text-align: center;
			}
			article { width: min(100%, 44rem); }
		.brand { font-size: .875rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
		.status { margin-top: 2rem; font: .875rem ui-monospace, monospace; letter-spacing: .16em; color: #6d625c; }
		h1 { margin: 1rem 0 0; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.15; }
		p { margin: 1rem auto 0; max-width: 42rem; line-height: 1.7; color: #6d625c; }
		nav { margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
		a { display: inline-block; border: 1px solid #d8d0ca; border-radius: .375rem; padding: .75rem 1.25rem; font-size: .875rem; font-weight: 600; color: #26211e; background: #fff; text-decoration: none; }
		a:first-child { border-color: #8a3f2d; color: #fff; background: #8a3f2d; }
		a:focus-visible { outline: 3px solid #c26b4e; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<article>
				<div class="brand">NRG Labware</div>
				<div class="status">404</div>
				<h1>找不到頁面 <span aria-hidden="true">|</span> Page not found</h1>
				<p>
					<span lang="zh-TW">找不到您要查看的頁面，請返回首頁或選擇其他內容。</span>
					<span aria-hidden="true"> </span>
					<span lang="en">The requested page could not be found. Return home or choose another page.</span>
				</p>
				<nav aria-label="Error recovery links">
					<a href="/">回到首頁 / Home</a>
					<a href="/en/">English home</a>
					<a href="/contact/">聯絡我們 / Contact</a>
				</nav>
			</article>
		</main>
	</body>
</html>
