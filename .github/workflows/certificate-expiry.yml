name: Certificate expiry check

on:
  schedule: [{ cron: '0 3 * * 1' }]
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: nrg-commerce-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform v4
        with: { terraform_version: 1.15.5, terraform_wrapper: false }
      - name: Inspect certificate expiration from Terraform state
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_CLOUD_PROJECT: nrg-commerce
        run: |
          set -euo pipefail
          terraform -chdir=infra/production init -input=false -lockfile=readonly
          expiry="$(terraform -chdir=infra/production output -raw origin_certificate_expiration_date)"
          remaining=$(( ( $(date -d "$expiry" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate expires in ${remaining} days"
          test "$remaining" -ge 30
